<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ana Zemin Kartı (Zümrüt Yeşili Squircle) -->
  <rect x="14" y="14" width="228" height="228" rx="52" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="4"/>

  <!-- Defter Gövdesi -->
  <g filter="url(#shadow)">
    <!-- Defter Arka / Beyaz Sayfaları -->
    <rect x="54" y="44" width="148" height="168" rx="14" fill="#ffffff"/>
    
    <!-- Defter Sırtı (Koyu Yeşil Şerit) -->
    <path d="M54 58 C54 50.268 60.268 44 68 44 L80 44 L80 212 L68 212 C60.268 212 54 205.732 54 198 Z" fill="#15803d"/>
    
    <!-- Cilt Dikiş Noktaları (Altın) -->
    <circle cx="67" cy="72" r="4" fill="#fbbf24"/>
    <circle cx="67" cy="128" r="4" fill="#fbbf24"/>
    <circle cx="67" cy="184" r="4" fill="#fbbf24"/>
  </g>

  <!-- Kırmızı / Turuncu Şık Defter Ayracı -->
  <path d="M152 44 L174 44 L174 104 L163 94 L152 104 Z" fill="#ea580c"/>

  <!-- Muhasebe Defter Satırları -->
  <line x1="96" y1="76" x2="140" y2="76" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="96" y1="94" x2="136" y2="94" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="96" y1="174" x2="182" y2="174" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="96" y1="192" x2="164" y2="192" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Parlayan Altın Para ve TL Simgesi -->
  <circle cx="128" cy="134" r="28" fill="url(#coinGrad)" stroke="#b45309" stroke-width="2.5"/>
  <text x="128" y="145" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#78350f" text-anchor="middle">₺</text>
</svg>
